random_scene_camera_node:
  ros__parameters:
    fps: 5.0
    image_width: 640
    image_height: 480

    minimum_cube_size: 36
    maximum_cube_size: 82

    minimum_total_cubes: 1
    maximum_total_cubes: 8
    maximum_obstacles: 2

    fixed_red_count: -1
    fixed_blue_count: -1
    fixed_obstacle_count: -1

    overlap_probability: 0.0
    scene_change_interval_sec: 30.0
    random_seed: 42

yolo_detector_node:
  ros__parameters:
    model_path: "~/robot_ws/models/final/red_blue_yolo11n_manual180_960_best.pt"

    image_topic: "/camera/image_raw"
    detections_topic: "/vision/yolo_detections"
    debug_image_topic: "/vision/yolo_debug_image"

    image_size: 960
    confidence_threshold: 0.10
    device: "cpu"

detection_fusion_node:
  ros__parameters:
    hsv_topic: "/vision/detections"
    yolo_topic: "/vision/yolo_detections"
    output_topic: "/vision/fused_detections"

    minimum_hsv_confidence: 0.50
    minimum_yolo_confidence: 0.05

    match_iou_threshold: 0.05
    duplicate_iou_threshold: 0.85
    keep_unmatched_yolo: true

    synchronization_queue_size: 200
    synchronization_slop_sec: 0.20
    log_every_n_messages: 10
